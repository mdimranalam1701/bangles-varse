<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F0E6D6"/>
    </radialGradient>
    <linearGradient id="gold22" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FCE49C"/>
      <stop offset="30%" stop-color="#D49D2A"/>
      <stop offset="65%" stop-color="#8C5B10"/>
      <stop offset="100%" stop-color="#F0C75E"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B6A16"/>
      <stop offset="50%" stop-color="#E8C25D"/>
      <stop offset="100%" stop-color="#7A4F0B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="475" rx="180" ry="24" fill="#2A1D16" fill-opacity="0.11"/>
  <!-- Left Kada -->
  <ellipse cx="258" cy="290" rx="126" ry="126" stroke="url(#goldInner)" stroke-width="34"/>
  <ellipse cx="258" cy="290" rx="126" ry="126" stroke="url(#gold22)" stroke-width="26"/>
  <ellipse cx="258" cy="290" rx="126" ry="126" stroke="#7A4F0B" stroke-width="2" stroke-dasharray="6 10"/>
  <!-- Right Overlapping Kada -->
  <ellipse cx="348" cy="322" rx="126" ry="126" stroke="url(#goldInner)" stroke-width="34"/>
  <ellipse cx="348" cy="322" rx="126" ry="126" stroke="url(#gold22)" stroke-width="26"/>
  <ellipse cx="348" cy="322" rx="126" ry="126" stroke="#FFF5D6" stroke-width="3" stroke-dasharray="3 18"/>
  <!-- Screw Clasp Accent -->
  <circle cx="458" cy="256" r="10" fill="#7C1D26" stroke="#FCE49C" stroke-width="3"/>
  <circle cx="150" cy="224" r="10" fill="#7C1D26" stroke="#FCE49C" stroke-width="3"/>
</svg>

