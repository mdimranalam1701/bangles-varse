<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F2E9DC"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="40%" stop-color="#C9972C"/>
      <stop offset="75%" stop-color="#8A5E14"/>
      <stop offset="100%" stop-color="#E7C160"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B28"/>
      <stop offset="50%" stop-color="#6B0F1A"/>
      <stop offset="100%" stop-color="#4A070F"/>
    </linearGradient>
    <radialGradient id="pearl" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#D5C8B8"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="485" rx="190" ry="26" fill="#2A1D16" fill-opacity="0.10"/>
  <!-- Outer Chooda Stack Back -->
  <ellipse cx="300" cy="295" rx="165" ry="118" stroke="url(#velvet)" stroke-width="26" transform="rotate(-14 300 295)"/>
  <ellipse cx="300" cy="295" rx="165" ry="118" stroke="url(#gold)" stroke-width="5" stroke-dasharray="14 10" transform="rotate(-14 300 295)"/>
  <!-- Center Kundan Kada -->
  <ellipse cx="300" cy="302" rx="138" ry="96" stroke="url(#gold)" stroke-width="30" transform="rotate(-14 300 302)"/>
  <ellipse cx="300" cy="302" rx="138" ry="96" stroke="#7C1D26" stroke-width="10" stroke-dasharray="18 22" transform="rotate(-14 300 302)"/>
  <ellipse cx="300" cy="302" rx="138" ry="96" stroke="#FFF9EE" stroke-width="7" stroke-dasharray="4 36" transform="rotate(-14 300 302)"/>
  <!-- Inner Velvet Ring -->
  <ellipse cx="300" cy="310" rx="108" ry="74" stroke="url(#velvet)" stroke-width="18" transform="rotate(-14 300 310)"/>
  <!-- Pearl accents -->
  <g fill="url(#pearl)">
    <circle cx="170" cy="336" r="7"/><circle cx="195" cy="368" r="7"/><circle cx="235" cy="388" r="7"/>
    <circle cx="282" cy="395" r="7"/><circle cx="332" cy="388" r="7"/><circle cx="378" cy="370" r="7"/>
    <circle cx="415" cy="340" r="7"/><circle cx="436" cy="298" r="7"/>
  </g>
</svg>

